<svg
  class="tahoe-icon"
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.9"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <ng-container [ngSwitch]="name">
    <ng-container *ngSwitchCase="'dashboard'">
      <path d="M4 13.5V6.8A2.8 2.8 0 0 1 6.8 4h3.9v9.5H4z" />
      <path d="M13.3 20H6.8A2.8 2.8 0 0 1 4 17.2v-1.9h6.7V20z" />
      <path d="M13.3 4h3.9A2.8 2.8 0 0 1 20 6.8v4.1h-6.7V4z" />
      <path d="M20 13.5v3.7A2.8 2.8 0 0 1 17.2 20h-3.9v-6.5H20z" />
    </ng-container>

    <ng-container *ngSwitchCase="'expense'">
      <path d="M7 3h10v18l-2-1-2 1-2-1-2 1-2-1-2 1V3z" />
      <path d="M9 8h6" />
      <path d="M9 12h6" />
      <path d="M9 16h4" />
    </ng-container>

    <ng-container *ngSwitchCase="'meal'">
      <path d="M7 3v8" />
      <path d="M5 3v4" />
      <path d="M9 3v4" />
      <path d="M6 11h2" />
      <path d="M14 3v8c0 2 2 2 2 0V3" />
      <path d="M16 3v18" />
    </ng-container>

    <ng-container *ngSwitchCase="'deposit'">
      <path
        d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9z"
      />
      <path d="M16 10.5h2.5a1.5 1.5 0 0 1 0 3H16" />
    </ng-container>

    <ng-container *ngSwitchCase="'members'">
      <path d="M16 11a3 3 0 1 0-6 0 3 3 0 0 0 6 0z" />
      <path d="M6.5 20a6.5 6.5 0 0 1 11 0" />
      <path d="M7.5 11a2.5 2.5 0 1 1 0-5" />
      <path d="M4 20a5 5 0 0 1 2.6-4.3" />
    </ng-container>

    <ng-container *ngSwitchCase="'settings'">
      <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" />
      <path
        d="M19.4 12a7.7 7.7 0 0 0-.1-1l2-1.4-2-3.4-2.4.7a7.8 7.8 0 0 0-1.7-1L14.7 3H9.3L8.8 5.9a7.8 7.8 0 0 0-1.7 1L4.7 6.2l-2 3.4 2 1.4a7.7 7.7 0 0 0 0 2l-2 1.4 2 3.4 2.4-.7a7.8 7.8 0 0 0 1.7 1l.5 2.9h5.4l.5-2.9a7.8 7.8 0 0 0 1.7-1l2.4.7 2-3.4-2-1.4c.1-.3.1-.6.1-1z"
      />
    </ng-container>

    <ng-container *ngSwitchCase="'logout'">
      <path d="M10 7V6a2 2 0 0 1 2-2h7v16h-7a2 2 0 0 1-2-2v-1" />
      <path d="M3 12h10" />
      <path d="M6.5 9.5 3 12l3.5 2.5" />
    </ng-container>

    <ng-container *ngSwitchCase="'exit'">
      <path d="M6 6l12 12" />
      <path d="M18 6L6 18" />
    </ng-container>

    <!-- Notification & Activity Icons -->
    <ng-container *ngSwitchCase="'bell'">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </ng-container>

    <ng-container *ngSwitchCase="'shopping-bag'">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
      <path d="M3 6h18" />
      <path d="M16 10a4 4 0 0 1-8 0" />
    </ng-container>

    <ng-container *ngSwitchCase="'utensils'">
      <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
      <path d="M7 2v20" />
      <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z" />
      <path d="M18 15v7" />
    </ng-container>

    <ng-container *ngSwitchCase="'wallet'">
      <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
      <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
      <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
    </ng-container>

    <ng-container *ngSwitchCase="'file-text'">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
      <path d="M14 2v6h6" />
      <path d="M16 13H8" />
      <path d="M16 17H8" />
      <path d="M10 9H8" />
    </ng-container>

    <ng-container *ngSwitchCase="'receipt'">
      <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z" />
      <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
      <path d="M12 6v12" />
    </ng-container>

    <ng-container *ngSwitchCase="'calendar'">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
      <path d="M16 2v4" />
      <path d="M8 2v4" />
      <path d="M3 10h18" />
    </ng-container>

    <!-- Suggestion & Utility Icons -->
    <ng-container *ngSwitchCase="'lightbulb'">
      <path
        d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"
      />
      <path d="M9 18h6" />
      <path d="M10 22h4" />
    </ng-container>

    <ng-container *ngSwitchCase="'book-open'">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
    </ng-container>

    <ng-container *ngSwitchCase="'refresh'">
      <path d="M21.5 2v6h-6" />
      <path d="M2.5 22v-6h6" />
      <path d="M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
    </ng-container>

    <ng-container *ngSwitchCase="'trending-up'">
      <path d="m22 7-8.5 8.5-5-5L2 17" />
      <path d="M16 7h6v6" />
    </ng-container>

    <ng-container *ngSwitchCase="'alert-circle'">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 8v4" />
      <path d="M12 16h.01" />
    </ng-container>

    <ng-container *ngSwitchCase="'info'">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    </ng-container>

    <ng-container *ngSwitchCase="'check-circle'">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
      <path d="m9 11 3 3L22 4" />
    </ng-container>

    <ng-container *ngSwitchCase="'x-circle'">
      <circle cx="12" cy="12" r="10" />
      <path d="m15 9-6 6" />
      <path d="m9 9 6 6" />
    </ng-container>

    <ng-container *ngSwitchCase="'inbox'">
      <path d="M22 12h-6l-2 3h-4l-2-3H2" />
      <path
        d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
      />
    </ng-container>

    <!-- fallback -->
    <ng-container *ngSwitchDefault>
      <circle cx="12" cy="12" r="8" />
    </ng-container>
  </ng-container>
</svg>
