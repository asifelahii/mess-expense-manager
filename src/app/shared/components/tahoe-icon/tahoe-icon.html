<svg
  class="tahoe-icon"
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.9"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <ng-container [ngSwitch]="name">
    <ng-container *ngSwitchCase="'dashboard'">
      <path d="M4 13.5V6.8A2.8 2.8 0 0 1 6.8 4h3.9v9.5H4z" />
      <path d="M13.3 20H6.8A2.8 2.8 0 0 1 4 17.2v-1.9h6.7V20z" />
      <path d="M13.3 4h3.9A2.8 2.8 0 0 1 20 6.8v4.1h-6.7V4z" />
      <path d="M20 13.5v3.7A2.8 2.8 0 0 1 17.2 20h-3.9v-6.5H20z" />
    </ng-container>

    <ng-container *ngSwitchCase="'expense'">
      <path d="M7 3h10v18l-2-1-2 1-2-1-2 1-2-1-2 1V3z" />
      <path d="M9 8h6" />
      <path d="M9 12h6" />
      <path d="M9 16h4" />
    </ng-container>

    <ng-container *ngSwitchCase="'meal'">
      <path d="M7 3v8" />
      <path d="M5 3v4" />
      <path d="M9 3v4" />
      <path d="M6 11h2" />
      <path d="M14 3v8c0 2 2 2 2 0V3" />
      <path d="M16 3v18" />
    </ng-container>

    <ng-container *ngSwitchCase="'deposit'">
      <path
        d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9z"
      />
      <path d="M16 10.5h2.5a1.5 1.5 0 0 1 0 3H16" />
    </ng-container>

    <ng-container *ngSwitchCase="'members'">
      <path d="M16 11a3 3 0 1 0-6 0 3 3 0 0 0 6 0z" />
      <path d="M6.5 20a6.5 6.5 0 0 1 11 0" />
      <path d="M7.5 11a2.5 2.5 0 1 1 0-5" />
      <path d="M4 20a5 5 0 0 1 2.6-4.3" />
    </ng-container>

    <ng-container *ngSwitchCase="'settings'">
      <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" />
      <path
        d="M19.4 12a7.7 7.7 0 0 0-.1-1l2-1.4-2-3.4-2.4.7a7.8 7.8 0 0 0-1.7-1L14.7 3H9.3L8.8 5.9a7.8 7.8 0 0 0-1.7 1L4.7 6.2l-2 3.4 2 1.4a7.7 7.7 0 0 0 0 2l-2 1.4 2 3.4 2.4-.7a7.8 7.8 0 0 0 1.7 1l.5 2.9h5.4l.5-2.9a7.8 7.8 0 0 0 1.7-1l2.4.7 2-3.4-2-1.4c.1-.3.1-.6.1-1z"
      />
    </ng-container>

    <ng-container *ngSwitchCase="'logout'">
      <path d="M10 7V6a2 2 0 0 1 2-2h7v16h-7a2 2 0 0 1-2-2v-1" />
      <path d="M3 12h10" />
      <path d="M6.5 9.5 3 12l3.5 2.5" />
    </ng-container>

    <ng-container *ngSwitchCase="'exit'">
      <path d="M6 6l12 12" />
      <path d="M18 6L6 18" />
    </ng-container>

    <!-- fallback -->
    <ng-container *ngSwitchDefault>
      <circle cx="12" cy="12" r="8" />
    </ng-container>
  </ng-container>
</svg>
