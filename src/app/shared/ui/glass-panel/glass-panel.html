<section class="gp-panel tahoe-glass">
  <ng-container *ngIf="layout === 'default'; else shellLayout">
    <header class="gp-header">
      <div class="gp-title">
        <ng-content select="[glassTitle]"></ng-content>
      </div>

      <div class="gp-actions">
        <ng-content select="[glassActions]"></ng-content>
      </div>
    </header>

    <div class="gp-body">
      <ng-content></ng-content>
    </div>
  </ng-container>

  <ng-template #shellLayout>
    <ng-content></ng-content>
  </ng-template>
</section>
