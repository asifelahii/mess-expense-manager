<section class="panel tahoe-glass">
  <!-- Default panel layout -->
  <ng-container *ngIf="layout === 'default'; else shellLayout">
    <header class="panel-header">
      <div class="panel-title">
        <ng-content select="[glassTitle]"></ng-content>
      </div>

      <div class="panel-actions">
        <ng-content select="[glassActions]"></ng-content>
      </div>
    </header>

    <div class="panel-body">
      <ng-content></ng-content>
    </div>
  </ng-container>

  <!-- Shell layout: consumer controls everything -->
  <ng-template #shellLayout>
    <ng-content></ng-content>
  </ng-template>
</section>
